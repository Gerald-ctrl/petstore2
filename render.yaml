services:
  # Backend Service
  - type: web
    name: petstore-backend
    env: java
    region: singapore
    plan: free
    buildCommand: ./mvnw clean install -f backend/pom.xml -DskipTests
    startCommand: java -jar backend/target/petstore-backend-1.0.0.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: petstore-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # Frontend Service
  - type: web
    name: petstore-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://petstore-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: petstore-db
    region: singapore
    plan: free
